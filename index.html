<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>L'Oréal Smart Product Advisor</title>

    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="page-wrapper">

        <!-- ================= Header ================= -->

        <header class="site-header">

            <img
                src="img/loreal-logo.png"
                alt="L'Oréal Logo"
                class="logo">

            <h1 class="site-title">

                Smart Product Advisor

            </h1>

            <p class="subtitle">

                Discover personalized skincare, makeup, and haircare recommendations powered by AI.

            </p>

        </header>

        <!-- ================= Chat ================= -->

        <main>

            <main>

<section class="products">

<h2>Choose Your Products</h2>

<input 
id="search"
type="text"
placeholder="Search products..."
>


<div id="productGrid" class="product-grid"></div>


<h2>Selected Products</h2>

<div id="selectedProducts">
No products selected
</div>


<button id="generateRoutine">
Generate Routine
</button>


</section>


<section class="chatbox">

<div id="chatWindow" class="chat-window"></div>


<div id="typing" class="typing hidden">
<span></span>
<span></span>
<span></span>
</div>


<form id="chatForm" class="chat-form">


<input
id="userInput"
placeholder="Ask about your routine..."
required
>


<button>
Send
</button>


</form>

</section>

</main>
        <!-- ================= Footer ================= -->

        <footer class="site-footer">

            <p>

                © 2026 L'Oréal. Educational project using the OpenAI API.

            </p>

            <nav>

                <a href="#">Privacy Policy</a>

                <a href="#">Terms of Use</a>

                <a href="#">Contact</a>

            </nav>

        </footer>

    </div>

    <script src="script.js"></script>

</body>

</html>
